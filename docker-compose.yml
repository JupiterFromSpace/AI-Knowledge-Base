services:

  db:
    # postgres:14-alpine does not ship the pgvector extension, so
    # `CREATE EXTENSION vector` (run by documents/migrations/0002_
    # enable_vector_extension.py) would fail against it. This is the
    # same Postgres 14 build, with pgvector pre-installed — nothing
    # else about the service changes.
    image: pgvector/pgvector:pg14
    container_name: ai_knowledge_base_db
    environment:
      POSTGRES_DB: ai_knowledge_base
      POSTGRES_USER: ai_knowledge_user
      POSTGRES_PASSWORD: ai_knowledge_pass
    ports:
      - "5432:5432"
    volumes:
      - ai_knowledge_base_postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: .
    container_name: ai_knowledge_base_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./core:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env


  redis:
    image: redis
    container_name: ai_knowledge_base_redis
    restart: always
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - ./core:/app
    depends_on:
      - redis
      - backend
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379



volumes:
  ai_knowledge_base_postgres_data: